name: Build Android beta APK
on:
  push:
    branches: [main]
    paths: ['app/**', 'web/index.html', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Use the latest game page, with three.js bundled for offline play
        run: |
          python3 - <<'PY'
          import re
          src = open('../web/index.html').read()
          src = src.replace('https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js', 'three.min.js')
          open('www/index.html', 'w').write(src)
          PY
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ../padel-doubles-3d-beta.apk
      - uses: actions/upload-artifact@v4
        with: { name: padel-doubles-3d-beta, path: padel-doubles-3d-beta.apk }
      - name: Publish to the "beta" release (fixed download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Padel Doubles 3D · beta
          prerelease: true
          files: padel-doubles-3d-beta.apk
          body: |
            Beta build for friends and family testing. Download the APK on an Android phone and open it to install.
            Built from commit ${{ github.sha }}.
